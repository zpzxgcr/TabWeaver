<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabWeaver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 380px; padding: 16px; font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; }
    .header, .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header { padding-bottom: 14px; border-bottom: 1px solid #293241; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 32px; height: 32px; }
    h1 { font-size: 16px; color: #fff; } h2 { font-size: 12px; }
    .subtitle, .status-label, .muted { color: #94a3b8; font-size: 11px; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
    .lang-btn { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 4px 8px; color: #cbd5e1; }
    .status-card { padding: 10px 12px; border: 1px solid #293241; border-radius: 10px; background: #191e29; margin-bottom: 14px; }
    .status-label { margin-bottom: 4px; }
    .current-tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .section-heading { margin-bottom: 8px; }
    #platform-search { width: 100%; color: #f1f5f9; background: #191e29; border: 1px solid #334155; border-radius: 7px; padding: 8px 10px; margin-bottom: 10px; }
    #platform-groups { max-height: 280px; overflow-y: auto; padding: 2px; }
    .group-title { color: #94a3b8; font-size: 11px; margin: 4px 0 6px; }
    .platforms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
    .platform-btn { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #1e293b; border: 1px solid #334155; color: #dbeafe; border-radius: 8px; padding: 6px 3px; font-size: 11px; }
    .platform-btn:hover { background: #1e40af; border-color: #60a5fa; }
    .platform-btn .icon { font-size: 15px; font-weight: 650; color: #93c5fd; }
    .platform-btn.current { border-color: #60a5fa; background: #172c4d; }
    .compatibility { margin: 8px 0 12px; color: #c4a876; font-size: 11px; }
    .guide-box { padding: 10px 12px; border-radius: 8px; background: #132137; border: 1px dashed #2e5080; color: #bfdbfe; font-size: 11px; }
    .guide-box ol { padding-left: 17px; margin-top: 4px; }
    #empty-platforms { color: #94a3b8; padding: 16px 0; text-align: center; }
    #popup-error { color: #fca5a5; margin-top: 8px; }
    .debug-box { margin-top:12px; padding:10px; border:1px solid #334155; border-radius:8px; }
    .debug-box label { display:flex; gap:7px; align-items:flex-start; margin:5px 0; }
    .debug-box button { background:#1e293b; color:#dbeafe; border:1px solid #475569; border-radius:5px; padding:4px 8px; margin:6px 6px 0 0; }
    #debug-path { overflow-wrap:anywhere; margin:4px 0; }
    #debug-phase { margin-top:4px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="logo" src="images/icon48.png" alt="">
      <div><h1>TabWeaver <span class="muted">2.1.3</span></h1><p class="subtitle" data-i18n="subtitle"></p></div>
    </div>
    <button class="lang-btn" id="lang-toggle-btn" type="button" aria-label="Switch language">中文</button>
  </header>
  <section class="status-card" aria-live="polite">
    <div class="status-label" id="active-tab-label" data-i18n="statusLabel"></div>
    <div class="current-tab-title" id="active-tab-title" data-i18n="detectingTab"></div>
  </section>
  <div class="section-heading"><h2 data-i18n="hubTitle"></h2><span class="muted" id="platform-count"></span></div>
  <input id="platform-search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
  <div id="platform-groups"></div>
  <p id="empty-platforms" data-i18n="noResults" hidden></p>
  <p class="compatibility" data-i18n="compatibility"></p>
  <section class="guide-box">
    <strong data-i18n="guideTitle"></strong>
    <ol>
      <li data-i18n="guideStep1"></li>
      <li data-i18n="guideStep2"></li>
      <li data-i18n="guideStep3"></li>
    </ol>
  </section>
  <section class="debug-box">
    <label><input id="debug-enabled" type="checkbox"><strong data-i18n="debugTitle"></strong></label>
    <p class="muted" data-i18n="debugHint"></p>
    <label><input id="debug-content" type="checkbox"><span class="muted" data-i18n="debugContent"></span></label>
    <div class="muted" id="debug-status" aria-live="polite"></div>
    <button id="debug-probe" type="button" data-i18n="debugProbe"></button>
    <span class="muted" id="debug-probe-result" role="status"></span>
    <button id="debug-export" type="button" data-i18n="debugExport"></button><button id="debug-clear" type="button" data-i18n="debugClear"></button>
    <p class="muted" id="debug-path"></p>
    <p class="muted" id="debug-phase"></p>
  </section>
  <p id="popup-error" role="alert" hidden></p>
  <script src="platforms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
