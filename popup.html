<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabWeaver</title>
  <style>
    :root {
      /* 浅色主题模式 (默认随本机系统) */
      --bg-primary: #ffffff;
      --bg-card: #f8fafc;
      --bg-input: #ffffff;
      --bg-btn: #f1f5f9;
      --bg-btn-hover: #e2e8f0;
      --bg-btn-current: #dbeafe;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-card: #e2e8f0;
      --border-focus: #3b82f6;
      --guide-bg: #eff6ff;
      --guide-border: #bfdbfe;
      --guide-text: #1d4ed8;
      --debug-box-bg: #f8fafc;
      --scrollbar-thumb: rgba(148, 163, 184, 0.35);
      --scrollbar-thumb-hover: rgba(100, 116, 139, 0.6);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* 深色主题模式 (本机系统偏好深色时自动激活) */
        --bg-primary: #0f1117;
        --bg-card: #191e29;
        --bg-input: #191e29;
        --bg-btn: #1e293b;
        --bg-btn-hover: #334155;
        --bg-btn-current: #172c4d;
        --text-primary: #f1f5f9;
        --text-muted: #94a3b8;
        --border-color: #293241;
        --border-card: #293241;
        --border-focus: #60a5fa;
        --guide-bg: #132137;
        --guide-border: #2e5080;
        --guide-text: #bfdbfe;
        --debug-box-bg: #191e29;
        --scrollbar-thumb: rgba(148, 163, 184, 0.25);
        --scrollbar-thumb-hover: rgba(148, 163, 184, 0.5);
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      padding: 16px;
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* 优化全局与平台列表滚动条样式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 999px;
      transition: background 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    .header, .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }
    h2 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .subtitle, .status-label, .muted {
      color: var(--text-muted);
      font-size: 11px;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }
    .lang-btn {
      background: var(--bg-btn);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 10px;
      color: var(--text-primary);
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .lang-btn:hover {
      background: var(--bg-btn-hover);
      border-color: var(--border-focus);
    }

    .status-card {
      padding: 10px 12px;
      border: 1px solid var(--border-card);
      border-radius: 10px;
      background: var(--bg-card);
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .status-label {
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .current-tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .section-heading {
      margin-bottom: 8px;
    }
    #platform-search {
      width: 100%;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      padding: 8px 10px;
      margin-bottom: 10px;
      transition: border-color 0.15s ease;
    }
    #platform-search:focus {
      border-color: var(--border-focus);
    }

    /* 平台列表滚动容器优化 */
    #platform-groups {
      max-height: 270px;
      overflow-y: auto;
      padding: 2px 4px 2px 0;
      margin-bottom: 8px;
    }
    .group-title {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      margin: 6px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .platforms {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }
    .platform-btn {
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--bg-btn);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 11px;
      transition: all 0.15s ease;
    }
    .platform-btn:hover {
      background: var(--bg-btn-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }
    .platform-btn .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }
    .platform-btn .icon svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .platform-btn .name-text {
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95%;
    }
    .platform-btn.current {
      border-color: var(--border-focus);
      background: var(--bg-btn-current);
      box-shadow: 0 0 0 1px var(--border-focus);
    }

    .compatibility {
      margin: 8px 0 12px;
      color: #d97706;
      font-size: 11px;
      line-height: 1.4;
    }
    .guide-box {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--guide-bg);
      border: 1px dashed var(--guide-border);
      color: var(--guide-text);
      font-size: 11px;
      line-height: 1.5;
    }
    .guide-box ol {
      padding-left: 17px;
      margin-top: 4px;
    }
    #empty-platforms {
      color: var(--text-muted);
      padding: 16px 0;
      text-align: center;
    }
    #popup-error {
      color: #ef4444;
      margin-top: 8px;
    }
    .debug-box {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--debug-box-bg);
    }
    .debug-box label {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      margin: 5px 0;
    }
    .debug-box button {
      background: var(--bg-btn);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 4px 8px;
      margin: 6px 6px 0 0;
      transition: all 0.15s ease;
    }
    .debug-box button:hover {
      background: var(--bg-btn-hover);
    }
    #debug-path {
      overflow-wrap: anywhere;
      margin: 4px 0;
    }
    #debug-phase {
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="logo" src="images/icon48.png" alt="logo">
      <div>
        <h1>TabWeaver <span class="muted" style="font-size:11px;font-weight:normal;">2.1.3</span></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
    </div>
    <button class="lang-btn" id="lang-toggle-btn" type="button" aria-label="Switch language">English</button>
  </header>

  <section class="status-card" aria-live="polite">
    <div class="status-label" id="active-tab-label">
      <div class="status-dot"></div>
      <span data-i18n="statusLabel"></span>
    </div>
    <div class="current-tab-title" id="active-tab-title" data-i18n="detectingTab"></div>
  </section>

  <div class="section-heading">
    <h2 data-i18n="hubTitle"></h2>
    <span class="muted" id="platform-count"></span>
  </div>
  <input id="platform-search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
  <div id="platform-groups"></div>
  <p id="empty-platforms" data-i18n="noResults" hidden></p>
  <p class="compatibility" data-i18n="compatibility"></p>

  <section class="guide-box">
    <strong data-i18n="guideTitle"></strong>
    <ol>
      <li data-i18n="guideStep1"></li>
      <li data-i18n="guideStep2"></li>
      <li data-i18n="guideStep3"></li>
    </ol>
  </section>

  <section class="debug-box">
    <label><input id="debug-enabled" type="checkbox"><strong data-i18n="debugTitle"></strong></label>
    <p class="muted" data-i18n="debugHint"></p>
    <label><input id="debug-content" type="checkbox"><span class="muted" data-i18n="debugContent"></span></label>
    <div class="muted" id="debug-status" aria-live="polite"></div>
    <button id="debug-probe" type="button" data-i18n="debugProbe"></button>
    <span class="muted" id="debug-probe-result" role="status"></span>
    <button id="debug-export" type="button" data-i18n="debugExport"></button>
    <button id="debug-clear" type="button" data-i18n="debugClear"></button>
    <p class="muted" id="debug-path"></p>
    <p class="muted" id="debug-phase"></p>
  </section>

  <p id="popup-error" role="alert" hidden></p>
  <script src="platforms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
