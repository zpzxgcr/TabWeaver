<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabWeaver</title>
  <style>
    :root {
      /* 浅色主题模式 (默认随本机系统) */
      --bg-primary: #ffffff;
      --bg-card: #f8fafc;
      --bg-input: #ffffff;
      --bg-btn: #f1f5f9;
      --bg-btn-hover: #e2e8f0;
      --bg-btn-current: #e0f2fe;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-card: #e2e8f0;
      --border-focus: #3b82f6;
      --guide-bg: #eff6ff;
      --guide-border: #bfdbfe;
      --guide-text: #1d4ed8;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* 深色主题模式 (本机系统偏好深色时自动激活) */
        --bg-primary: #0f1117;
        --bg-card: #191e29;
        --bg-input: #191e29;
        --bg-btn: #1e293b;
        --bg-btn-hover: #334155;
        --bg-btn-current: #172c4d;
        --text-primary: #f1f5f9;
        --text-muted: #94a3b8;
        --border-color: #293241;
        --border-card: #293241;
        --border-focus: #60a5fa;
        --guide-bg: #132137;
        --guide-border: #2e5080;
        --guide-text: #bfdbfe;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* 彻底去除所有滚动条 (保证极简平铺视觉体验) */
    html, body, div, section {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      width: 380px;
      padding: 14px 16px 0;
      font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.2s ease, color 0.2s ease;
      overflow: hidden;
    }

    .header, .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .header {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }
    h2 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .subtitle, .status-label, .muted {
      color: var(--text-muted);
      font-size: 11px;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 1px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 24px;
      background: var(--bg-btn);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .icon-btn:hover {
      background: var(--bg-btn-hover);
      border-color: var(--border-focus);
      color: var(--text-primary);
      transform: translateY(-1px);
    }
    .icon-btn svg {
      display: block;
    }
    .lang-btn {
      background: var(--bg-btn);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 8px;
      height: 24px;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 11px;
      transition: all 0.15s ease;
    }
    .lang-btn:hover {
      background: var(--bg-btn-hover);
      border-color: var(--border-focus);
    }

    .status-card {
      padding: 8px 10px;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      background: var(--bg-card);
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .status-label {
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .current-tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .section-heading {
      margin-bottom: 8px;
    }

    /* 平台列表完全直接平铺展开，彻底无滚动条 */
    #platform-groups {
      margin-bottom: 12px;
    }
    .group-title {
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 600;
      margin: 6px 0 5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .platforms {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
    }
    .platform-btn {
      min-height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--bg-btn);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 7px;
      padding: 6px 4px;
      font-size: 11px;
      transition: all 0.15s ease;
    }
    .platform-btn:hover {
      background: var(--bg-btn-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }
    .platform-btn .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }
    .platform-btn .icon svg {
      width: 22px;
      height: 22px;
      display: block;
    }
    .platform-btn .name-text {
      font-size: 10.5px;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95%;
    }
    .platform-btn.current {
      border-color: var(--border-focus);
      background: var(--bg-btn-current);
      box-shadow: 0 0 0 1px var(--border-focus);
    }

    #empty-platforms {
      color: var(--text-muted);
      padding: 12px 0;
      text-align: center;
    }
    #popup-error {
      color: #ef4444;
      margin-top: 6px;
    }
    .footer-bar {
      margin-top: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      transition: color 0.15s ease;
    }
    .footer-link:hover {
      color: var(--border-focus);
    }
    .footer-link svg {
      display: block;
      width: 13px;
      height: 13px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="logo" src="images/icon48.png" alt="logo">
      <div>
        <h1>TabWeaver <span class="muted" style="font-size:10.5px;font-weight:normal;">2.1.5</span></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
    </div>
    <div class="header-actions">
      <a class="icon-btn" id="github-link" href="https://github.com/zpzxgcr/TabWeaver" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">

        </svg>
      </a>
      <button class="lang-btn" id="lang-toggle-btn" type="button" aria-label="Switch language">English</button>
    </div>
  </header>

  <section class="status-card" aria-live="polite">
    <div class="status-label" id="active-tab-label">
      <div class="status-dot"></div>
      <span data-i18n="statusLabel"></span>
    </div>
    <div class="current-tab-title" id="active-tab-title" data-i18n="detectingTab"></div>
  </section>

  <div class="section-heading">
    <h2 data-i18n="hubTitle"></h2>
  </div>
  <div id="platform-groups"></div>

  <footer class="footer-bar">
    <a class="footer-link" id="feedback-link" href="https://github.com/zpzxgcr/TabWeaver" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      <span data-i18n="feedbackLabel"></span>
    </a>
  </footer>

  <p id="popup-error" role="alert" hidden></p>
  <script src="platforms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
